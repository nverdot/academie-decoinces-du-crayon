name: Build and deploy academie.decoincesducrayon.com (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-academie
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Garde-fou : la racine FTP est le dossier du site principal. Y déployer
      # l'Académie écraserait nicolasverdot.com. On refuse donc « / », un
      # chemin vide, ou un chemin qui ne nomme pas un sous-dossier.
      - name: Vérifier la cible FTP
        env:
          DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$DIR" ]; then
            echo "::error::Le secret FTP_SERVER_DIR est vide."
            exit 1
          fi
          if [ "$DIR" = "/" ] || [ "$DIR" = "." ] || [ "$DIR" = "./" ]; then
            echo "::error::FTP_SERVER_DIR vaut « $DIR », c'est-à-dire la racine du compte FTP."
            echo "::error::Déployer là écraserait le site qui s'y trouve déjà."
            echo "::error::Renseignez le dossier du sous-domaine academie.decoincesducrayon.com."
            exit 1
          fi
          echo "Cible FTP acceptée : $DIR"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Dossier du sous-domaine sur le serveur, ex. /academie.decoincesducrayon.com/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # Le dossier du sous-domaine ne contient que ce site : on peut
          # laisser l'action supprimer les fichiers devenus orphelins.
          dangerous-clean-slate: false
